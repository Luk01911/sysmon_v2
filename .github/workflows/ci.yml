name: C Systems CI & Memory Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Build Tools & Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make valgrind curl

    - name: Compile and Test Server
      run: |
        make clean
        make

        # Detect executable name
        if [ -f ./sysmon ]; then
          EXEC="./sysmon"
        else
          EXEC="./build/sysmon_server"
        fi

        echo "Testing binary: $EXEC"
        $EXEC 8080 &
        SERVER_PID=$!
        sleep 2

        # Verify telemetry endpoint responds
        RESPONSE=$(curl -s http://localhost:8080)
        echo "Server Output:"
        echo "$RESPONSE"

        # Signal shutdown and suppress exit code 130 from wait
        kill -2 $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true

    - name: Memory Leak Verification (Valgrind)
      run: |
        if [ -f ./sysmon ]; then
          EXEC="./sysmon"
        else
          EXEC="./build/sysmon_server"
        fi

        valgrind --leak-check=full $EXEC 8080 &
        VALGRIND_PID=$!
        sleep 2

        curl -s http://localhost:8080 > /dev/null || true

        # Signal shutdown and suppress exit code 130 from wait
        kill -2 $VALGRIND_PID 2>/dev/null || true
        wait $VALGRIND_PID 2>/dev/null || true
